<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hacking Ético</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1 class="title">Hacking Ético</h1>

    <p class="desc">
      El hacking ético ayuda a prevenir ataques y proteger sistemas.
      Este libro explica cómo hacerlo de forma legal y responsable.
    </p>

    <button class="btn primary" onclick="abrirLibro()">
      📘 Libro del hacker
    </button>

    <p class="ip-text">
      Si quieres ver tu Dirección IP, presiona el botón
    </p>

    <button class="btn ip" onclick="verIP()">
      🌐 Ver IP
    </button>

    <div id="ipResultado" class="warning"></div>

    <button class="btn speed" onclick="medirInternet()">
      📶 Medir Internet
    </button>

    <div id="speedResultado" class="speed-result"></div>

    <button class="btn tools">
      🛠 Herramientas
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
