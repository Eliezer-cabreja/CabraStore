<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Chicken Runner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block">
<style>
:root{--ink:#1d2f6f;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd8ff;font-family:"Lilita One","Trebuchet MS",Verdana,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.hide{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;font-size:30px;color:#fff;pointer-events:none;text-shadow:0 3px 0 #1d2f6f,0 0 8px #1d2f6f}
.ti{width:1.1em;height:1.1em;border-radius:50%;vertical-align:-0.2em;margin:0 .15em}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.top{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.sq{width:46px;height:46px;border-radius:8px;border:3px solid #fff;background:#2f8fe0;color:#fff;font-size:24px;box-shadow:0 3px 0 #1d2f6f;display:grid;place-items:center;cursor:pointer;padding:0}
.pill{background:#1d2f6fcc;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 14px;font-size:22px}
.logo{margin:0;text-align:center;font-weight:400;font-size:clamp(40px,min(13vw,15vh),96px);line-height:.88;color:#ffd21f;-webkit-text-stroke:3px #7a1f0e;paint-order:stroke fill;text-shadow:0 5px 0 #c8341c,0 9px 0 #5a1208,0 12px 18px #0006;transform:rotate(-3deg)}
.logo small{display:block;font-size:.62em;color:#fff;-webkit-text-stroke:3px #d6362b;margin-top:4px}
.play{font-size:clamp(22px,5vw,34px);color:#fff;text-shadow:0 3px 0 #1d2f6f,0 0 14px #000a;animation:pulse 1.2s ease-in-out infinite;margin-bottom:8px}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.play{animation:none}}
.nav{display:flex;gap:10px;width:100%;max-width:520px}
.nav button{flex:1;font-family:inherit;font-size:clamp(18px,4.5vw,26px);color:#ffd21f;background:#27337a;border:3px solid #fff;border-radius:14px;padding:12px 6px;box-shadow:0 5px 0 #121a4a;cursor:pointer;text-shadow:0 2px 0 #000}
.nav button:active,.b:active{transform:translateY(3px)}
#dlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;padding:20px}
#dlg.on{display:flex}
.card{position:relative;width:min(100%,360px);background:#fff;border-radius:12px;border:3px solid #cfd6e8;box-shadow:0 8px 0 #0004,0 14px 30px #0006;padding:24px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.card h2{margin:0 0 4px;font-size:30px;color:var(--ink);font-weight:400}
.card p{margin:0;color:#4a5578;font-family:"Trebuchet MS",sans-serif;font-size:15px}
.chip{position:absolute;top:10px;right:10px;background:#5b5f6e;color:#fff;border-radius:8px;padding:2px 10px;font-size:18px}
.ring{position:absolute;top:-16px;left:-16px;width:50px;height:50px;border-radius:50%;border:4px solid #fff;outline:3px solid #2f8fe0;background:conic-gradient(#fff 360deg,#2f8fe0 0)}
.b{font-family:inherit;font-size:26px;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;text-shadow:0 2px 0 #0005}
.b.green{background:linear-gradient(#7cc72f,#5a9f1e);box-shadow:0 4px 0 #3d6e12}
.b.purple{background:linear-gradient(#6a62d6,#4b43b0);box-shadow:0 4px 0 #2d2878}
.b.sm{font-size:18px;padding:6px 10px}
.b:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.tv{display:inline-block;background:#2f8fe0;border:2px solid #f5a623;border-radius:6px;padding:0 6px;font-size:18px;margin-left:6px}
.link{font-family:inherit;background:none;border:0;color:#4a5578;font-size:18px;cursor:pointer;text-decoration:underline}
.rows{display:grid;grid-template-columns:1fr auto;gap:8px 14px;text-align:left;font-size:20px}
.rows b{font-weight:400;text-align:right;color:#d6362b}
.item{display:flex;justify-content:space-between;align-items:center;font-size:20px;gap:8px}
.item em{color:#3d8a1a;font-style:normal}
.b:focus-visible,.sq:focus-visible,.nav button:focus-visible,.link:focus-visible{outline:3px solid #ffd21f;outline-offset:2px}
.hint{max-width:36ch;text-align:center;color:#fff;font-size:17px;line-height:1.25;text-shadow:0 2px 0 #1d2f6f,0 0 10px #000a;margin-bottom:8px}
.fine{color:#fff;font-size:13px;text-shadow:0 1px 0 #1d2f6f,0 0 6px #000a;margin-top:4px;text-align:center}
@media (max-width:420px){#hud{font-size:24px}.sq{width:40px;height:40px}.pill{font-size:18px;padding:4px 10px}.card h2{font-size:26px}.b{font-size:22px}.hint{font-size:15px}}
@media (max-height:460px){.hint,.fine{display:none}.nav button{padding:8px 6px}.card{padding:18px 16px 14px;gap:8px}.play{margin-bottom:2px}}
.b.gold{background:linear-gradient(#ffd84a,#e8a417);color:#5a3a00;text-shadow:none;box-shadow:0 4px 0 #a86e0a}
#pu{font-size:22px;align-self:center}
#pbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#ffd84a,#e8a417);font-size:28px;box-shadow:0 4px 0 #a86e0a;pointer-events:auto;cursor:pointer;padding:0}
.item span{text-align:left}.item small{font-family:"Trebuchet MS",sans-serif;font-size:13px;color:#4a5578}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";vertical-align:-0.18em;font-size:1.15em;user-select:none}
.b,.link{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nav button{display:flex;align-items:center;justify-content:center;gap:6px}
#pbtn{color:#5a3a00;display:grid;place-items:center}
#pausebtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:16px;width:44px;height:44px;border-radius:10px;border:3px solid #fff;background:#2f8fe0;color:#fff;font-size:22px;box-shadow:0 3px 0 #1d2f6f;pointer-events:auto;cursor:pointer;padding:0;display:grid;place-items:center}
.pic{width:54px;height:54px;flex:none;border-radius:12px;background:linear-gradient(#eef3ff,#d3dcf6);border:2px solid #b9c5e8;display:grid;place-items:center}
.pic svg{width:42px;height:42px}
.item span{flex:1}
#shout{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:clamp(30px,8vw,64px);color:#fff;-webkit-text-stroke:2px #1d2f6f;paint-order:stroke fill;text-shadow:0 4px 0 #1d2f6f,0 0 18px #000a;transform:rotate(-4deg);pointer-events:none}

.card.wide{width:min(100%,520px);padding:22px 16px 14px}
.tabs{display:flex;gap:4px;background:#e4eafb;border-radius:14px;padding:4px}
.tab{flex:1;font-family:inherit;font-size:16px;color:#4a5578;background:none;border:0;border-radius:11px;padding:9px 2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 #c0cbea}
.tab:focus-visible{outline:3px solid #ffd21f;outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sitem{background:linear-gradient(#f9fbff,#e5ecfb);border:2px solid #cdd7f2;border-radius:16px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.sitem .pic{width:76px;height:76px;border-radius:50%}
.sitem .pic svg{width:58px;height:58px}
.sitem h3{margin:0;font-size:20px;font-weight:400;color:var(--ink)}
.sitem small{font-family:"Trebuchet MS",sans-serif;font-size:12px;color:#4a5578;line-height:1.25;min-height:30px}
.sitem .b{width:100%}
.badge{background:#ffd21f;color:#5a3a00;border-radius:999px;padding:2px 10px;font-size:13px;display:inline-flex;align-items:center;gap:3px}
.badge.g{background:#7cc72f;color:#fff}.badge.n{background:#cdd7f2;color:#3b4670}

/* Tienda: diseño oscuro y sobrio */
.card.shop{width:min(100%,540px);background:#121622;border:1px solid #2b3347;border-radius:16px;color:#e8ecf5;padding:18px 16px 16px;gap:14px;text-align:left;font-family:Inter,system-ui,"Trebuchet MS",sans-serif}
.shead{display:flex;align-items:center;gap:10px}
.shead h2{margin:0;flex:1;font:600 15px/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e8ecf5;display:flex;align-items:center;gap:8px}
.sbal{display:inline-flex;align-items:center;gap:4px;border:1px solid #c9a227;color:#f3d46a;border-radius:999px;padding:5px 12px;font:600 14px Inter,system-ui,sans-serif}
.sx{background:none;border:1px solid #2b3347;color:#8a93ab;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0;font-size:20px}
.sx:hover{color:#fff;border-color:#4a5578}
.stabs{display:flex;gap:20px;border-bottom:1px solid #2b3347}
.stab{background:none;border:0;border-bottom:2px solid transparent;color:#8a93ab;font:600 12px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px}
.stab.on{color:#fff;border-color:#e8b422}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sc{background:#1a2030;border:1px solid #2b3347;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sp{height:92px;border-radius:10px;background:radial-gradient(circle at 50% 40%,#2c3650,#171c2a 70%);display:grid;place-items:center}
.sp svg{width:60px;height:60px}.sp img{height:100%;max-width:100%;object-fit:contain}
.sc h3{margin:2px 0 0;font:600 15px Inter,system-ui,sans-serif;color:#fff}
.sc p{margin:0;font:400 12px/1.35 Inter,system-ui,sans-serif;color:#8a93ab;min-height:32px}
.stag{font:600 10px Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8a93ab;display:inline-flex;align-items:center;gap:4px}
.stag.ok{color:#6fd08c}
.sbuy{background:#e8b422;color:#1a1200;border:0;border-radius:8px;padding:9px 10px;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.sbuy:disabled{background:#2b3347;color:#6b7590;cursor:not-allowed}
.sbuy:active{transform:translateY(1px)}
.shint{margin:0;font:400 12px Inter,system-ui,sans-serif;color:#8a93ab}
.sc.pj{flex-direction:row;align-items:center;gap:16px}
.sp.big{width:150px;height:150px;flex:none}
.pi{display:flex;flex-direction:column;gap:8px}.pi h3{font-size:22px}
.sbuy:focus-visible,.stab:focus-visible,.sx:focus-visible{outline:2px solid #e8b422;outline-offset:2px}

/* Login */
#login{position:fixed;inset:0;z-index:50;display:flex;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;touch-action:pan-y;font-family:Inter,system-ui,"Trebuchet MS",sans-serif;color:#e8ecf5;user-select:text;-webkit-user-select:text}
.lg-bg{position:fixed;inset:0;background:radial-gradient(900px 500px at 50% -5%,#ffd21f2e,transparent 60%),linear-gradient(#0a0f1ecc,#0a0f1ef0);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.lg-wrap{position:relative;width:min(100%,400px);display:flex;flex-direction:column;align-items:center;gap:20px;margin:auto}
.lg-card{width:100%;background:rgba(19,24,41,.88);border:1px solid #2f3856;border-radius:20px;padding:20px 18px 18px;box-shadow:0 24px 60px #000a,0 0 0 1px #ffffff08 inset;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0d1120;border-radius:13px;padding:4px;margin-bottom:16px}
.lg-tabs button{border:0;background:none;color:#8a93ab;font:600 14px Inter,system-ui,sans-serif;padding:11px 6px;border-radius:10px;cursor:pointer}
.lg-tabs button.on{background:#232b45;color:#fff;box-shadow:0 1px 0 #3a4570 inset}
#lgForm{display:flex;flex-direction:column;gap:12px}
.lg-f{display:flex;align-items:center;gap:10px;background:#0d1120;border:1px solid #2f3856;border-radius:12px;padding:0 12px;height:50px;color:#7d87a3}
.lg-f:focus-within{border-color:#e8b422;box-shadow:0 0 0 3px #e8b42226;color:#e8b422}
.lg-f[hidden]{display:none}
.lg-f input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font:400 16px Inter,system-ui,sans-serif}
.lg-f input::placeholder{color:#6b7590}
.lg-eye{background:none;border:0;color:#7d87a3;cursor:pointer;padding:4px;display:grid;place-items:center}
.lg-eye:hover{color:#fff}
.lg-err{color:#ffb4ac;background:#ff6b5b1f;border:1px solid #ff6b5b55;border-radius:10px;padding:10px 12px;font:500 13px/1.35 Inter,system-ui,sans-serif}
.lg-err:empty{display:none}
.lg-err.info{color:#b9ccff;background:#4a6bff1f;border-color:#4a6bff55}
.lg-btn{height:50px;border:0;border-radius:12px;background:linear-gradient(#ffd54a,#e8a417);color:#241800;font:700 15px Inter,system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;box-shadow:0 8px 20px #e8a41740}
.lg-btn:hover{filter:brightness(1.05)}.lg-btn:active{transform:translateY(1px)}
.lg-btn:disabled{filter:grayscale(.6);opacity:.7;cursor:progress}
.lg-or{display:flex;align-items:center;gap:12px;color:#6b7590;font:500 12px Inter,system-ui,sans-serif;margin:18px 0 14px}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:#2f3856}
.lg-soc{display:flex;flex-direction:column;gap:10px}
.soc{height:46px;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.soc svg{width:20px;height:20px}
.soc:hover{filter:brightness(1.06)}.soc:active{transform:translateY(1px)}
.soc.g{background:#fff;color:#3c4043}.soc.t{background:#229ed9;color:#fff}.soc.f{background:#1877f2;color:#fff}
.lg-btn:focus-visible,.soc:focus-visible,.lg-tabs button:focus-visible{outline:3px solid #ffd21f;outline-offset:2px}

/* Configuración */
.card.cfg{width:min(100%,700px);height:min(86vh,540px);max-height:none;background:#121622;border:1px solid #2b3347;border-radius:16px;color:#e8ecf5;padding:0;gap:0;text-align:left;font-family:Inter,system-ui,"Trebuchet MS",sans-serif;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #232a3f}
.chead h2{margin:0;flex:1;font:600 15px/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e8ecf5;display:flex;align-items:center;gap:8px}
.cx{background:none;border:1px solid #2b3347;color:#8a93ab;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0;font-size:20px}
.cx:hover{color:#fff;border-color:#4a5578}
.cbody{flex:1;min-height:0;display:grid;grid-template-columns:176px 1fr}
.cnav{display:flex;flex-direction:column;gap:4px;padding:12px;border-right:1px solid #232a3f;overflow:auto}
.ct{display:flex;align-items:center;gap:10px;background:none;border:0;border-left:3px solid transparent;color:#8a93ab;font:600 13px Inter,system-ui,sans-serif;letter-spacing:.03em;padding:12px 10px;border-radius:8px;cursor:pointer;text-align:left}
.ct:hover{color:#fff}
.ct.on{background:#1c2338;color:#fff;border-left-color:#e8b422}
.cpane{padding:4px 20px 18px;overflow:auto;min-height:0}
.cr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid #232a3f}
.cr .cl{font:500 14px Inter,system-ui,sans-serif;color:#e8ecf5}
.cr small{display:block;color:#8a93ab;font:400 12px/1.35 Inter,system-ui,sans-serif;margin-top:3px}
.tg{width:46px;height:26px;border-radius:13px;border:0;background:#2b3347;position:relative;cursor:pointer;padding:0;flex:none;transition:background .15s}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:#e8b422}.tg.on i{transform:translateX(20px)}
.sl{display:flex;align-items:center;gap:12px;width:min(260px,52%)}
.sl input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#e8b422 var(--p,50%),#2b3347 var(--p,50%));outline:0;cursor:pointer;margin:0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #e8b422}
.sl input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #e8b422}
.sl b{min-width:44px;text-align:right;font:700 14px Inter,system-ui,sans-serif;color:#f3d46a}
.seg{display:flex;background:#0d1120;border:1px solid #2b3347;border-radius:10px;padding:3px;gap:3px;flex:none}
.seg button{border:0;background:none;color:#8a93ab;font:600 13px Inter,system-ui,sans-serif;padding:8px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:#e8b422;color:#1a1200}
.cbtn{display:inline-flex;align-items:center;gap:6px;background:#1c2338;border:1px solid #2f3856;color:#e8ecf5;border-radius:10px;padding:9px 14px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer;flex:none}
.cbtn:hover{border-color:#4a5578}
.cbtn.danger{color:#ff9d94;border-color:#6a2a26}
.khead{margin:18px 0 6px;font:600 11px Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8a93ab}
.kr{display:flex;align-items:center;gap:12px;padding:6px 0;font:400 13px Inter,system-ui,sans-serif;color:#c9d0e4}
.kr kbd{min-width:104px;text-align:center;background:#1c2338;border:1px solid #2f3856;border-bottom-width:2px;border-radius:7px;padding:4px 8px;font:600 12px Inter,system-ui,sans-serif;color:#fff}
.cacc{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid #232a3f}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(#ffd54a,#e8a417);color:#241800;display:grid;place-items:center;font:700 20px Inter,system-ui,sans-serif;flex:none}
.cacc b{display:block;font:600 16px Inter,system-ui,sans-serif;color:#fff}
.cacc small{color:#8a93ab;font:400 12px Inter,system-ui,sans-serif}
.cx:focus-visible,.ct:focus-visible,.cbtn:focus-visible,.tg:focus-visible,.seg button:focus-visible{outline:2px solid #e8b422;outline-offset:2px}
#fps{position:fixed;left:8px;bottom:8px;z-index:30;background:#000a;color:#7dff9a;font:600 12px monospace;padding:3px 8px;border-radius:6px;pointer-events:none}
@media (max-width:560px){
  .card.cfg{height:min(90vh,660px)}
  .cbody{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .cnav{flex-direction:row;border-right:0;border-bottom:1px solid #232a3f;overflow-x:auto;padding:6px 8px;gap:2px}
  .ct{flex:none;border-left:0;border-bottom:3px solid transparent;border-radius:6px;padding:10px 12px}
  .ct.on{border-bottom-color:#e8b422}
  .cr{flex-wrap:wrap}.sl{width:100%}
}
</style></head>
<body>
<script>
(function(){
  function show(m){var d=document.getElementById('fatal');if(d&&d.textContent)return;if(!d){d=document.createElement('div');d.id='fatal';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#7a1a14;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:10px 12px;border-radius:10px;white-space:pre-wrap';document.body.appendChild(d)}d.textContent='Error del juego: '+m}
  addEventListener('error',function(e){show((e.message||'desconocido')+(e.lineno?' (línea '+e.lineno+')':''))});
  addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason))});

// Foto de Timi tal como se ve en el juego (se genera con el mismo modelo 3D)
function snapTimi(){
  const key=P.own.join(',');if(snapTimi.k===key)return snapTimi.u;
  try{
    // Se usa el mismo renderizador del juego (sin crear otro contexto 3D, que en algunos teléfonos tira abajo los gráficos)
    const ex=[coop,nest,seeds,cart,board,eyesZ,...zz,...skates],sv=ex.map(o=>o.visible),lv=[legL.visible,legR.visible],bp=body.position.y,br=body.rotation.x,lr=[legL.rotation.x,legR.rotation.x];
    ex.forEach(o=>o.visible=false);legL.visible=legR.visible=true;legL.rotation.x=legR.rotation.x=0;body.position.y=0;body.rotation.x=0;
    const pc=chicken.clone(true);
    ex.forEach((o,i)=>o.visible=sv[i]);legL.visible=lv[0];legR.visible=lv[1];legL.rotation.x=lr[0];legR.rotation.x=lr[1];body.position.y=bp;body.rotation.x=br;
    pc.position.set(0,0,0);pc.rotation.set(0,Math.PI+0.55,0);pc.scale.set(1,1,1);pc.visible=true;
    const W=512,rt=new THREE.WebGLRenderTarget(W,W),sc=new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff,0x6b8f3a,0.85));const dl=new THREE.DirectionalLight(0xfff0c8,0.8);dl.position.set(5,12,6);sc.add(dl);sc.add(pc);
    const cam=new THREE.PerspectiveCamera(32,1,0.1,60);cam.position.set(0.8,1.5,6.2);cam.lookAt(0,1.1,0);
    renderer.setClearColor(0x000000,0);renderer.setRenderTarget(rt);renderer.render(sc,cam);renderer.setRenderTarget(null);renderer.setClearColor(0x000000,1);
    const px=new Uint8Array(W*W*4);renderer.readRenderTargetPixels(rt,0,0,W,W,px);rt.dispose();
    const cv=document.createElement('canvas');cv.width=cv.height=W;const x=cv.getContext('2d'),id=x.createImageData(W,W);
    for(let y=0;y<W;y++)id.data.set(px.subarray((W-1-y)*W*4,(W-y)*W*4),y*W*4);
    x.putImageData(id,0,0);snapTimi.u=cv.toDataURL('image/png');snapTimi.k=key;
  }catch(e){snapTimi.u='';try{renderer.setRenderTarget(null);renderer.setClearColor(0x000000,1)}catch(_){}}
  return snapTimi.u;
}

  if(k==='ArrowLeft'||k==='a'||k==='A')move(-1);

  else if(k==='ArrowUp'||k===' '||k==='w'||k==='W'){e.preventDefault();jump()}

async function apiPost(path,body){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),10000);
  try{const r=await fetch(API_BASE+path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:JSON.stringify(body),signal:ac.signal});
    let d={};try{d=await r.json()}catch(e){}
    return{ok:r.ok,status:r.status,data:d||{}}}
  catch(e){return{net:true}}
  finally{clearTimeout(tm)}
}

async function lgSubmit(e){
  e.preventDefault();
  const er=$('lgErr'),go=$('lgGo');
  const fail=m=>{er.className='lg-err';er.textContent=m};
  const label=go.textContent;
  try{
    const name=$('lgName').value.trim(),em=$('lgEmail').value.trim().toLowerCase(),pw=$('lgPw').value;
    er.className='lg-err';er.textContent='';
    if(!lgIn&&!/^[\wÀ-ÿ .-]{3,20}$/.test(name))return fail('El nombre de usuario debe tener entre 3 y 20 caracteres.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return fail('Escribe un correo válido.');
    if(pw.length<6)return fail('La contraseña debe tener al menos 6 caracteres.');
    if(!lgIn&&pw!==$('lgPw2').value)return fail('Las contraseñas no coinciden.');
    go.disabled=true;go.textContent='Conectando…';cspHit=false;
    const down=async()=>{await new Promise(r=>setTimeout(r,80));fail(cspHit?'Esta página no tiene permiso para conectarse a tu servidor (bloqueo de seguridad del navegador). Abre el juego desde tu propio dominio.':'No se pudo conectar con el servidor. Inténtalo más tarde.')};
    const r=await apiPost(lgIn?'/api/auth/loguearse':'/api/auth/registrarse',lgIn?{email:em,password:pw}:{name,email:em,password:pw});
    if(r.net)return await down();
    let L=r;
    if(lgIn){
      if(!(r.ok&&r.data.status===true))return fail(r.data.mensaje||r.data.message||'Correo o contraseña incorrectos.');
    }else{
      if(!(r.status===201||r.data.status===true))return fail(r.data.mensaje||r.data.message||'No se pudo crear la cuenta.');
      L=await apiPost('/api/auth/loguearse',{email:em,password:pw});
      if(L.net)return await down();
      if(!(L.ok&&L.data.status===true)){lgMode('in');$('lgEmail').value=em;$('lgPw').value='';er.className='lg-err info';er.textContent='Cuenta creada. Ahora inicia sesión.';return}
    }
    const D=L.data.Datos||{};
    loginOK(em,D.name||(lgIn?em:name),D.token);
  }catch(x){fail(typeof THREE==='undefined'?'No se pudo cargar la librería 3D del juego (three.js). Revisa tu conexión a internet o desactiva el bloqueador de anuncios.':'Error inesperado: '+(x&&x.message||x))}
  finally{go.disabled=false;go.textContent=lgIn?'Entrar':'Crear cuenta';void label}
}

    +'<div class="khead">Celular</div>'+keys([['Deslizar ← →','Cambiar de carril'],['Deslizar ↑','Saltar'],['Doble toque','Abrir potenciadores']]);
  else if(cfgTab==='acc')p=ACC
    ?'<div class="cacc"><div class="av">'+esc((NAME||ACC).charAt(0).toUpperCase())+'</div><div><b>'+esc(NAME||ACC)+'</b><small>'+esc(ACC)+'</small></div></div>'
      +row('Cerrar sesión','Vuelves a la pantalla de inicio de sesión','<button class="cbtn" onclick="logout()">'+ic('logout')+' Salir</button>')
      +row('Borrar progreso','Elimina tus BABYPFLOW, objetos y récords de este dispositivo','<button class="cbtn danger" onclick="cfgWipe()">'+ic('delete')+(wipeArm?' ¿Seguro?':' Borrar')+'</button>')
    :row('Sesión','No has iniciado sesión','');
  else p=row('Juego','Chicken Runner','')+row('Versión','1.0','');
  show('<div class="chead"><h2>'+ic('settings')+' Configuración</h2><button class="cx" onclick="hide()" aria-label="Cerrar">'+ic('close')+'</button></div><div class="cbody"><nav class="cnav">'+nav+'</nav><div class="cpane">'+p+'</div></div>','cfg');
}

// ---- Música: original, generada con Web Audio. Una sola canción para todo el juego (no cambia entre mundos) ----
let musicOn=CFG.music;
const AU={ctx:null,master:null,rv:null,nz:null,step:0,next:0};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SONG={tempo:124,
  chords:[[60,64,67],[59,62,67],[57,60,64],[57,60,65],[60,64,67],[59,62,67],[57,60,65],[59,62,67]],
  bass:[48,43,45,41,48,43,41,43],
  bpat:[0,null,null,0,null,null,7,null,0,null,null,12,null,null,7,null],
  mel:['76 . . 79 . . 76 . 74 . 72 . . . . .','74 . . 79 . . 74 . 71 . 74 . . . . .','72 . . 76 . . 81 . 79 . 76 . . . 72 .','77 . 76 . 72 . . . 69 . 72 . 77 . . .',
       '79 . 79 . 76 . 79 . 84 . . . 79 . . .','83 . 83 . 79 . 74 . 79 . . . 71 . . .','81 . 81 . 77 . 72 . 77 . 81 . 84 . . .','83 . 81 . 79 . 74 . 71 . 74 . 79 . . .'].map(b=>b.split(' ').map(x=>x==='.'?null:+x))};
function audioInit(){
  if(AU.ctx)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();AU.master=c.createGain();AU.master.gain.value=0;
  const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  AU.nz=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=AU.nz.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const len=Math.floor(c.sampleRate*1.8),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const x=ir.getChannelData(ch);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5)}
  AU.rv=c.createConvolver();AU.rv.buffer=ir;const rg=c.createGain();rg.gain.value=0.35;AU.rv.connect(rg);rg.connect(AU.master);
  AU.next=c.currentTime+0.1;setInterval(audioTick,40);
}
function env(t,peak,dec,att){const g=AU.ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+(att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dec);return g}
function osc(type,f,t,dur,det){const o=AU.ctx.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.start(t);o.stop(t+dur);return o}
function send(g,wet){g.connect(AU.master);if(wet){const w=AU.ctx.createGain();w.gain.value=wet;g.connect(w);w.connect(AU.rv)}}
function lp(f){const q=AU.ctx.createBiquadFilter();q.type='lowpass';q.frequency.value=f;return q}
function noise(t,dur,vol,fr,type){const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nz;f.type=type||'highpass';f.frequency.value=fr;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);send(g,type==='bandpass'?0.2:0);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02)}
function kick(t,v){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+0.1);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+0.28)}
function clap(t){[0,0.012,0.024].forEach(d=>noise(t+d,0.09,0.1,1500,'bandpass'))}
function pluck(t,m){const f=mtof(m),g=env(t,0.13,0.45),g2=env(t,0.04,0.14);osc('sine',f,t,0.5).connect(g);osc('sine',f*4,t,0.2).connect(g2);send(g,0.35);send(g2,0.2)}
function stab(t,notes){notes.forEach(m=>{const f=mtof(m),g=env(t,0.03,0.16),q=lp(2200);osc('sawtooth',f,t,0.2,-7).connect(q);osc('sawtooth',f,t,0.2,7).connect(q);q.connect(g);send(g,0.25)})}
function bassN(t,m,dur){const f=mtof(m),g=env(t,0.22,dur,0.01),q=lp(500);osc('sine',f,t,dur+0.05).connect(q);osc('triangle',f,t,dur+0.05).connect(q);q.connect(g);g.connect(AU.master)}
function pad(t,notes,dur){notes.forEach(m=>{const g=env(t,0.018,dur,0.5);osc('triangle',mtof(m-12),t,dur+0.1).connect(g);send(g,0.4)})}
function schedStep(i,t){
  const bar=(i>>4)&7,st=i&15;
  if(st%4===0)kick(t,0.75);
  if(st===4||st===12)clap(t);
  if(st%2===0)noise(t,st%4===2?0.12:0.03,st%4===2?0.05:0.03,8000);else noise(t,0.02,0.015,9000);
  const b=SONG.bpat[st];if(b!==null)bassN(t,SONG.bass[bar]+b,0.26);
  if(st===2||st===6||st===10||st===14)stab(t,SONG.chords[bar]);
  if(st===0)pad(t,SONG.chords[bar],1.9);
  const m=SONG.mel[bar][st];if(m!==null)pluck(t,m);
}
function audioTick(){
  const c=AU.ctx;if(!c)return;
  AU.master.gain.setTargetAtTime(musicOn&&state==='menu'?CFG.vol/100*0.7:0,c.currentTime,0.12);   // la música solo suena en el lobby
  if(!musicOn||state!=='menu'||c.state!=='running'){AU.next=Math.max(AU.next,c.currentTime+0.05);return}
  while(AU.next<c.currentTime+0.25){
    schedStep(AU.step,AU.next);
    AU.next+=60/(SONG.tempo*(1+Math.min(0.15,Math.max(0,speed-13)/200)))/4;AU.step=(AU.step+1)%128;
  }
}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{if(musicOn)audioInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume()},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(AU.ctx)document.hidden?AU.ctx.suspend():AU.ctx.resume()});

// Bucle
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rdt=now-last,dt=Math.min(rdt/1000,0.05);last=now;t+=dt;if(CFG.fps)fpsTick(rdt);
  if(state==='play'){
    boost+=((pu.k==='carrito'?1.6:pu.k==='patineta'?1.4:pu.k==='patines'?1.2:1)-boost)*Math.min(1,dt*3);
    speed=Math.min(13+dist*0.018,42)*boost;
    const dz=speed*dt;dist+=dz*0.5;
    inv=Math.max(0,inv-dt);chicken.visible=inv<=0||Math.floor(t*14)%2===0;
    const ghost=pu.k==='carrito'||pu.k==='patineta';if(pu.k){pu.t-=dt;if(pu.t<=0)endPU()}
    $('pu').textContent=pu.k?PU[pu.k].n+' '+Math.ceil(pu.t)+'s':'';
    let nb=0;BIOMES.forEach((m,i)=>{if(dist%2200>=m.d)nb=i});if(nb!==bi){bi=nb;swapDeco()}
    px+=(LANES[laneIdx]-px)*Math.min(1,dt*14);
    if(pu.k==='patineta'){py+=(4-py)*Math.min(1,dt*3);vy=0}else{vy-=32*dt;py+=vy*dt;if(py<0){py=0;vy=0}}
    // Generar
    if(dist>=spawnAt){spawnPattern(-130);spawnAt=dist+9+Math.random()*5-Math.min(dist*0.002,3)}
    if(dist>=treeAt){makeTree(-130);if(bi===0&&Math.random()<0.5)makeTree(-126);makeDash(-130);treeAt=dist+2}
    // Mover y colisiones
    for(const o of obstacles){
      o.z+=dz;o.g.position.z=o.z;
      if(Math.abs(o.z)<0.85&&Math.abs(o.g.position.x-px)<1.05&&py<=(o.low?0.95:2.3)&&inv<=0&&!ghost){die();}
    }
    for(const c of cornItems){
      c.z+=dz;c.g.position.z=c.z;c.g.rotation.y+=dt*4;
      if(!c.got&&Math.abs(c.z)<0.9&&Math.abs(c.g.position.x-px)<1.0){c.got=true;c.g.visible=false;corns++;P.coins++}
    }
    animDeco(dt,speed,true);
    for(let i=deco.length-1;i>=0;i--){const d=deco[i];
      if(d.out!==undefined){d.out+=dt;const k=1-d.out/0.7;if(k<=0){scene.remove(d.g);deco.splice(i,1);continue}d.g.scale.setScalar(k)}
      else if(d.inn!==undefined){d.inn+=dt;const k=Math.min(1,d.inn/0.7);d.g.scale.setScalar(Math.max(0.001,k));if(k>=1)delete d.inn}}
    for(const arr of [obstacles,cornItems,deco])for(let i=arr.length-1;i>=0;i--)if(arr[i].z>12){scene.remove(arr[i].g);arr.splice(i,1)}
    updateHud();
    // Animar pollo
    const f=t*22;
    legL.rotation.x=py>0?-0.6:Math.sin(f)*0.9;legR.rotation.x=py>0?0.6:-Math.sin(f)*0.9;
    body.position.y=py>0?0:Math.abs(Math.sin(f))*0.12;
    wL.rotation.z=wR.rotation.z=0;
    wL.rotation.z=-Math.abs(Math.sin(f*0.5))*(py>0?1.2:0.3);wR.rotation.z=-wL.rotation.z;
    chicken.position.set(px,py,0);
    chicken.rotation.z=(px-LANES[laneIdx])*0.25;
  }else if(state==='intro'){introStep(dt)
  }else if(state==='pause'){
  }else if(state==='over'){
    tilt=Math.min(tilt+dt*3,1.5);
    if(phase==='save'){saveT-=dt;const r=$('ring');if(r)r.style.background='conic-gradient(#fff '+Math.max(0,saveT/6*360)+'deg,#2f8fe0 0)';if(saveT<=0)results()}
    body.rotation.z=tilt;body.position.y=0;chicken.position.y=0;
  }else{
    // Menú: pollo corriendo en el lugar
    animDeco(dt,6,false);const br=Math.sin(t*1.8);
    legL.visible=legR.visible=false;nest.visible=false;seeds.visible=false;coop.visible=true;
    body.position.y=-0.5;body.rotation.x=-0.3+0.03*br;body.scale.set(1,1+0.03*br,1);eyesZ.visible=true;
    zz.forEach((m,i)=>{const u=(t*0.35+i/3)%1,sc=0.35+u*0.45;m.visible=true;m.position.set(0.5+Math.sin(u*6+i)*0.15,1.1+u*1.3,-1.7);m.scale.set(sc,sc,1);m.material.opacity=Math.sin(Math.PI*u)});wL.rotation.z=wR.rotation.z=0;
    chicken.position.set(-6.2,0.45,-1.0);coop.scale.setScalar(portrait?0.75:1);
    chicken.rotation.y=Math.PI;
  }
  skyUpdate(dt);fxUpdate(dt);tint(Math.min(1,dt*1.5));
  if(state==='menu'){const pw=portrait;camera.position.set(-6.2+(pw?1.8:3.9),pw?2.4:2.2,-1.0+(pw?8.4:7.5));camera.lookAt(camera.position.x,pw?1.4:1.3,camera.position.z-10)}
  else if(state!=='intro'){camera.position.set(chicken.position.x*0.6,CY+py*0.25,CZ);camera.lookAt(chicken.position.x*0.4,1.3,-7)}
  renderer.render(scene,camera);
}
reset();applyCos();upTok();applyQuality();applyFps();if(ACC&&TOKEN){
  if(VALIDATE_PATH){showLogin();apiPost(VALIDATE_PATH,{token:TOKEN}).then(r=>{if(r.ok&&r.data.status===true)loginOK(ACC,NAME,TOKEN);else logout()})}
  else hideLogin();
}else{ACC=null;showLogin()}
$('play').textContent=COARSE?'TOCA PARA JUGAR':'CLIC PARA JUGAR';
$('menu').addEventListener('click',e=>{if(state==='menu'&&!e.target.closest('button'))start()});
requestAnimationFrame(frame);
</script>
