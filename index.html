<script>
(function(){
  function show(m){var d=document.getElementById('fatal');if(d&&d.textContent)return;if(!d){d=document.createElement('div');d.id='fatal';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#7a1a14;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:10px 12px;border-radius:10px;white-space:pre-wrap';document.body.appendChild(d)}d.textContent='Algo salió mal. Recarga la página.';console.error(m)}
  addEventListener('error',function(e){show((e.message||'desconocido')+(e.lineno?' (línea '+e.lineno+')':''))});
  addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason))});
})();
</script>
